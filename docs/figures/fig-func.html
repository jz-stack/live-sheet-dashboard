<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{width:900px;height:440px;}
  text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <!-- root -->
  <rect x="300" y="16" width="300" height="50" rx="7" fill="#1F6FB2"/>
  <text x="450" y="47" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">实时 Excel 数据可视化大屏</text>

  <!-- trunk -->
  <line x1="450" y1="66" x2="450" y2="96" stroke="#7EA6C9" stroke-width="1.4"/>
  <line x1="108" y1="96" x2="792" y2="96" stroke="#7EA6C9" stroke-width="1.4"/>

  <!-- columns: 30,201,372,543,714 width 156 -->
  <!-- col1 -->
  <line x1="108" y1="96" x2="108" y2="120" stroke="#7EA6C9" stroke-width="1.4"/>
  <rect x="30" y="120" width="156" height="44" rx="6" fill="#EAF3FB" stroke="#5C97C9" stroke-width="1.3"/>
  <text x="108" y="148" font-size="16" font-weight="700" fill="#16304A" text-anchor="middle">数据接入</text>
  <line x1="108" y1="164" x2="108" y2="192" stroke="#A9C7E2" stroke-width="1.3"/>
  <rect x="30" y="192" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="108" y="215" font-size="14.5" fill="#33506D" text-anchor="middle">文件监听与重载</text>
  <rect x="30" y="236" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>

  <rect x="30" y="280" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>

  <rect x="30" y="324" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="108" y="347" font-size="14.5" fill="#33506D" text-anchor="middle">异常降级保留</text>

  <!-- col2 -->
  <line x1="279" y1="96" x2="279" y2="120" stroke="#7EA6C9" stroke-width="1.4"/>
  <rect x="201" y="120" width="156" height="44" rx="6" fill="#EAF3FB" stroke="#5C97C9" stroke-width="1.3"/>

  <line x1="279" y1="164" x2="279" y2="192" stroke="#A9C7E2" stroke-width="1.3"/>
  <rect x="201" y="192" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>

  <rect x="201" y="236" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="279" y="259" font-size="14.5" fill="#33506D" text-anchor="middle">清洗与体检</text>
  <rect x="201" y="280" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="279" y="303" font-size="14.5" fill="#33506D" text-anchor="middle">资源上限保护</text>
  <rect x="201" y="324" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="279" y="347" font-size="14.5" fill="#33506D" text-anchor="middle">行数据分页</text>

  <!-- col3 -->
  <line x1="450" y1="96" x2="450" y2="120" stroke="#7EA6C9" stroke-width="1.4"/>
  <rect x="372" y="120" width="156" height="44" rx="6" fill="#EAF3FB" stroke="#5C97C9" stroke-width="1.3"/>
  <text x="450" y="148" font-size="16" font-weight="700" fill="#16304A" text-anchor="middle">可视化画布</text>
  <line x1="450" y1="164" x2="450" y2="192" stroke="#A9C7E2" stroke-width="1.3"/>
  <rect x="372" y="192" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="450" y="215" font-size="14.5" fill="#33506D" text-anchor="middle">12 列栅格布局</text>
  <rect x="372" y="236" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="450" y="259" font-size="14.5" fill="#33506D" text-anchor="middle">6 类组件</text>
  <rect x="372" y="280" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="450" y="303" font-size="14.5" fill="#33506D" text-anchor="middle">拖拽与三向缩放</text>
  <rect x="372" y="324" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="450" y="347" font-size="14.5" fill="#33506D" text-anchor="middle">布局持久化</text>

  <!-- col4 -->
  <line x1="621" y1="96" x2="621" y2="120" stroke="#7EA6C9" stroke-width="1.4"/>
  <rect x="543" y="120" width="156" height="44" rx="6" fill="#EFEDFB" stroke="#8B7BFF" stroke-width="1.3"/>
  <text x="621" y="148" font-size="16" font-weight="700" fill="#2B2350" text-anchor="middle">智能助手</text>
  <line x1="621" y1="164" x2="621" y2="192" stroke="#C9C2F0" stroke-width="1.3"/>
  <rect x="543" y="192" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#D8D3F2"/>
  <text x="621" y="215" font-size="14.5" fill="#3A3263" text-anchor="middle">一句话建图</text>
  <rect x="543" y="236" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#D8D3F2"/>
  <text x="621" y="259" font-size="14.5" fill="#3A3263" text-anchor="middle">洞察扫描</text>
  <rect x="543" y="280" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#D8D3F2"/>
  <text x="621" y="303" font-size="14.5" fill="#3A3263" text-anchor="middle">画布体检</text>
  <rect x="543" y="324" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#D8D3F2"/>
  <text x="621" y="347" font-size="14.5" fill="#3A3263" text-anchor="middle">画布预览审阅</text>

  <!-- col5 -->
  <line x1="792" y1="96" x2="792" y2="120" stroke="#7EA6C9" stroke-width="1.4"/>
  <rect x="714" y="120" width="156" height="44" rx="6" fill="#EAF3FB" stroke="#5C97C9" stroke-width="1.3"/>
  <text x="792" y="148" font-size="16" font-weight="700" fill="#16304A" text-anchor="middle">系统保障</text>
  <line x1="792" y1="164" x2="792" y2="192" stroke="#A9C7E2" stroke-width="1.3"/>
  <rect x="714" y="192" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="792" y="215" font-size="14.5" fill="#33506D" text-anchor="middle">安全边界</text>
  <rect x="714" y="236" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="792" y="259" font-size="14.5" fill="#33506D" text-anchor="middle">健康与诊断接口</text>
  <rect x="714" y="280" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="792" y="303" font-size="14.5" fill="#33506D" text-anchor="middle">错误隔离</text>
  <rect x="714" y="324" width="156" height="36" rx="5" fill="#FFFFFF" stroke="#C6DAEA"/>
  <text x="792" y="347" font-size="14.5" fill="#33506D" text-anchor="middle">自动化测试</text>

  <text x="450" y="400" font-size="13.5" fill="#7A93AD" text-anchor="middle">蓝色为数据与渲染主链路，紫色为模型建议相关能力（建议必须经用户采用才落盘）</text>
</svg>
</div>
</body>
</html>
